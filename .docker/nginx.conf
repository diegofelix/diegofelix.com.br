server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Todas as páginas são pré-renderizadas (vite-ssg), então não há fallback de SPA:
    # /blog -> /blog/index.html sem redirect para /blog/, e o que não existir é 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404/index.html;

    # Arquivos com hash no nome podem ser cacheados para sempre
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:ico|png|jpg|webp|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
